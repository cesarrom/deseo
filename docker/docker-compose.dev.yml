services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deseo-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: deseo
      POSTGRES_PASSWORD: deseo_dev_password
      POSTGRES_DB: deseo_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deseo']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deseo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: deseo-temporal
    restart: unless-stopped
    ports:
      - '7233:7233'
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=deseo
      - POSTGRES_PWD=deseo_dev_password
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - temporal_data:/etc/temporal

  temporal-ui:
    image: temporalio/ui:latest
    container_name: deseo-temporal-ui
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  deseo-caddy:
    image: caddy:2-alpine
    container_name: deseo-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      WEB_HOST: host.docker.internal
      API_HOST: host.docker.internal
      CONNECTOR_GITHUB_HOST: host.docker.internal
      CONNECTOR_GSC_HOST: host.docker.internal
      CONNECTOR_PAYLOAD_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  temporal_data:
