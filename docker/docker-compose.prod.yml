services:
  postgres:
    image: postgres:16-alpine
    container_name: deseo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deseo-network

  redis:
    image: redis:7-alpine
    container_name: deseo-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - deseo-network

  temporal:
    image: temporalio/auto-setup:latest
    container_name: deseo-temporal-prod
    restart: always
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres
    networks:
      - deseo-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: deseo-temporal-ui-prod
    restart: always
    ports:
      - '8080:8080'
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - deseo-network

volumes:
  postgres_data:
  redis_data:

networks:
  deseo-network:
    driver: bridge
